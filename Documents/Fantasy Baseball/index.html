  for(const s of SLOTS){if(!roster[s.id]&&s.l!=="Util"&&s.l!=="P"&&s.l!=="BN"&&s.m(player))return s.id;}
  if(player.type==="B"&&!roster.Util)return"Util";

  for(const s of SLOTS){if(!roster[s.id]&&s.l==="BN")return s.id;}

// AI pick logic
function aiPick(avail,roster){
  const has={};SLOTS.forEach(s=>{if(roster[s.id])has[s.l]=(has[s.l]||0)+1;});
  const sc=avail.map(p=>{
    let s=1000-p.adp;
    if(p.type==="B"&&(p.pos||"").includes("C")&&!has.C)s+=15;
    if(p.type==="B"&&(p.pos||"").includes("SS")&&!has.SS)s+=5;
    if(p.type==="P"&&p.pt==="RP"&&(has.RP||0)<2)s+=5;
    return{...p,_s:s};
  });
  sc.sort((a,b)=>b._s-a._s);
  const t=sc.slice(0,3),r=Math.random();
  return t.length<2?t[0]:r<0.7?t[0]:r<0.9?t[1]:t[2]||t[0];
}

  const my=draftPos;const cur=picks.length+1;const curTm=teamForPick(cur);
  const isMe=curTm===my;const rd=Math.ceil(cur/TEAMS);const done=cur>TOTAL;
  const myR=rosters[my]||{};const filled=Object.values(myR).filter(Boolean).length;
  const sp=useMemo(()=>snakePicks(draftPos),[draftPos]);
  const nxtMy=sp.find(p=>p>cur);

  const disp=useMemo(()=>{
    let a=[...avail];
    if(search){const s=search.toLowerCase();a=a.filter(x=>(x.n||"").toLowerCase().includes(s)||(x.t||"").toLowerCase().includes(s));}
    if(posF!=="ALL"){if(posF==="SP"||posF==="RP")a=a.filter(x=>x.type==="P"&&(x.pt===posF||(x.pos||"").includes(posF)));else a=a.filter(x=>x.type==="B"&&(x.pos||"").includes(posF));}
    if(showWO)a=a.filter(x=>watch.has(wk(x)));
    a.sort((a,b)=>b.par-a.par);return a;
  },[avail,search,posF,showWO,watch]);

  const makePick=useCallback(player=>{
    const tm=teamForPick(picks.length+1);
    setPicks(p=>[...p,{pk:p.length+1,tm,player}]);
    setAvail(p=>p.filter(x=>x.n!==player.n||x.t!==player.t));
    setRosters(p=>{const r={...(p[tm]||{})};const s=assignSlot(r,player);if(s)r[s]=player;return{...p,[tm]:r};});
  },[picks.length]);

  const runAI=useCallback(()=>{
    if(picks.length+1>TOTAL){setPhase("done");return;}
    const tm=teamForPick(picks.length+1);
    if(tm===my){setPhase("myPick");return;}
    const pk=aiPick(avail,rosters[tm]||{});if(pk)makePick(pk);
  },[picks.length,avail,rosters,my,makePick]);

  useEffect(()=>{

    }if(done)setPhase("done");

  useEffect(()=>{if(logRef.current)logRef.current.scrollTop=logRef.current.scrollHeight;},[picks.length]);

  const userPick=p=>{makePick(p);setPhase("running");setSearch("");setPosF("ALL");setShowWO(false);};
  const start=()=>{setPicks([]);setAvail([...ALL_P,...ALL_B].sort((a,b)=>a.adp-b.adp));const r={};for(let i=1;i<=TEAMS;i++)r[i]={};setRosters(r);setPhase("running");};
  const reset=()=>{setPhase("setup");setPicks([]);setAvail([...ALL_P,...ALL_B].sort((a,b)=>a.adp-b.adp));const r={};for(let i=1;i<=TEAMS;i++)r[i]={};setRosters(r);};
  const skip=()=>{let p=[...picks],av=[...avail],rs={};for(let k in rosters)rs[k]={...(rosters[k]||{})};
    let ct=p.length+1;while(ct<=TOTAL){const tm=teamForPick(ct);if(tm===my)break;const pk=aiPick(av,rs[tm]||{});if(!pk)break;p.push({pk:ct,tm,player:pk});av=av.filter(x=>x.n!==pk.n||x.t!==pk.t);const s=assignSlot(rs[tm]||{},pk);if(s){if(!rs[tm])rs[tm]={};rs[tm][s]=pk;}ct++;}
    setPicks(p);setAvail(av);setRosters(rs);setPhase(ct>TOTAL?"done":"myPick");};

  if(phase==="setup")return h("div",{style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:20,padding:20}},

        h("div",{style:{textAlign:"center",marginLeft:6}},h("div",{style:{fontSize:8,color:"#7a7060"}},"RD"),h("div",{style:{fontSize:14,fontWeight:700,color:"#d4c8b0"}},rd)),

    // 3 panels
    h("div",{style:{flex:1,display:"flex",overflow:"hidden"}},

                h("td",{style:{padding:"4px 8px"}},h("div",{style:{display:"flex",alignItems:"center",gap:5}},

                    h("div",{style:{fontSize:8,color:"#9a8e7a",display:"flex",gap:2}},

// ====== ROSTER BUILDER MODE ======
function RosterMode({watch,tw,wk}){
  const[draftPos,setDraftPos]=useState(()=>{try{return parseInt(localStorage.getItem("vnv_dp"))||11}catch(e){return 11}});
  const[plan,setPlan]=useState(()=>{try{return JSON.parse(localStorage.getItem("vnv_plan"))||{}}catch(e){return{}}});
  const[search,setSearch]=useState("");
  const[posF,setPosF]=useState("ALL");
  const[view,setView]=useState("pos"); // "pos" or "round"
  const[selSlot,setSelSlot]=useState(null);
  const[poolSort,setPoolSort]=useState("adp");
  const[poolAsc,setPoolAsc]=useState(true); // which slot is being filled
  useEffect(()=>{try{localStorage.setItem("vnv_plan",JSON.stringify(plan))}catch(e){}},[plan]);
  useEffect(()=>{try{localStorage.setItem("vnv_dp",String(draftPos))}catch(e){}},[draftPos]);

  const sp=useMemo(()=>snakePicks(draftPos),[draftPos]);

  // All players pool
  const allPool=useMemo(()=>{
    const map=new Map();
    [...ALL_P,...ALL_B].forEach(p=>{
      const k=p.n+"~"+p.t;
      if(!map.has(k)||p.pts>map.get(k).pts)map.set(k,p);
    });
    const arr=[...map.values()].sort((a,b)=>b.par-a.par);
    arr.forEach((p,i)=>{p.parRk=i+1;});
    return arr.sort((a,b)=>a.adp-b.adp);
  },[]);

  // Planned player keys
  const plannedKeys=useMemo(()=>{
    const s=new Set();
    Object.values(plan).forEach(v=>{if(v&&v.n)s.add(v.n+"~"+v.t);});
    return s;
  },[plan]);

  // Roster structure with rounds
  const rosterSlots=[
    {id:"C",l:"C",rd:null,pos:"C"},
    {id:"1B",l:"1B",rd:null,pos:"1B"},
    {id:"2B",l:"2B",rd:null,pos:"2B"},
    {id:"3B",l:"3B",rd:null,pos:"3B"},
    {id:"SS",l:"SS",rd:null,pos:"SS"},
    {id:"OF1",l:"OF",rd:null,pos:"OF"},
    {id:"OF2",l:"OF",rd:null,pos:"OF"},
    {id:"OF3",l:"OF",rd:null,pos:"OF"},
    {id:"Util",l:"Util",rd:null,pos:"Util"},
    {id:"SP1",l:"SP",rd:null,pos:"SP"},
    {id:"SP2",l:"SP",rd:null,pos:"SP"},
    {id:"RP1",l:"RP",rd:null,pos:"RP"},
    {id:"RP2",l:"RP",rd:null,pos:"RP"},
    {id:"P",l:"P",rd:null,pos:"P"},
    {id:"BN1",l:"BN",rd:null,pos:"BN"},
    {id:"BN2",l:"BN",rd:null,pos:"BN"},
    {id:"BN3",l:"BN",rd:null,pos:"BN"},
    {id:"BN4",l:"BN",rd:null,pos:"BN"},
    {id:"BN5",l:"BN",rd:null,pos:"BN"},
  ];

  const assign=(slotId,player,round)=>{
    setPlan(prev=>({...prev,[slotId]:{...player,targetRd:round}}));
    setSelSlot(null);
    setSearch("");
  };
  const unassign=(slotId)=>{
    setPlan(prev=>{const n={...prev};delete n[slotId];return n;});
  };
  const clearAll=()=>{if(confirm("Clear entire roster plan?"))setPlan({});};

  // Filtered available pool when selecting
  const filteredPool=useMemo(()=>{
    let arr=allPool.filter(p=>!plannedKeys.has(p.n+"~"+p.t));
    if(search){const s=search.toLowerCase();arr=arr.filter(x=>(x.n||"").toLowerCase().includes(s)||(x.t||"").toLowerCase().includes(s));}
    if(selSlot){
      const slot=rosterSlots.find(s=>s.id===selSlot);
      if(slot&&slot.pos!=="BN"&&slot.pos!=="Util"&&slot.pos!=="P"){
        if(slot.pos==="SP")arr=arr.filter(x=>x.type==="P"&&x.pt==="SP");
        else if(slot.pos==="RP")arr=arr.filter(x=>x.type==="P"&&(x.pos||"").includes("RP"));
        else arr=arr.filter(x=>x.type==="B"&&(x.pos||"").includes(slot.pos));
      } else if(slot&&slot.pos==="P"){
        arr=arr.filter(x=>x.type==="P");
      } else if(slot&&slot.pos==="Util"){
        arr=arr.filter(x=>x.type==="B");
      }
    }
    if(posF!=="ALL"&&!selSlot){
      if(posF==="SP"||posF==="RP")arr=arr.filter(x=>x.type==="P"&&(x.pt===posF||(x.pos||"").includes(posF)));
      else arr=arr.filter(x=>x.type==="B"&&(x.pos||"").includes(posF));
    }
    arr.sort((a,b)=>{const av=a[poolSort]??999999,bv=b[poolSort]??999999;const c=av>bv?1:av<bv?-1:0;return poolAsc?c:-c;});
    return arr;
  },[allPool,plannedKeys,search,selSlot,posF,poolSort,poolAsc]);

  // Build round-based view data
  const byRound=useMemo(()=>{
    const entries=Object.entries(plan).filter(([k,v])=>v&&v.targetRd).sort((a,b)=>a[1].targetRd-b[1].targetRd);
    return entries;
  },[plan]);

  // Total projected points
  const totalPts=useMemo(()=>{
    return Object.values(plan).filter(Boolean).reduce((s,p)=>s+p.pts,0);
  },[plan]);
  const filledCount=Object.values(plan).filter(Boolean).length;

  const doPoolSort=(col)=>{setPoolSort(prev=>{if(prev===col){setPoolAsc(a=>!a);return col;}setPoolAsc(col==="pts"||col==="par"?false:true);return col;});};
  const posOpts=["ALL","C","1B","2B","3B","SS","OF","DH","SP","RP"];
  const S={padding:"5px",textAlign:"right",color:"#b0a898",fontSize:11,fontVariantNumeric:"tabular-nums"};

  return h("div",{style:{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}},
    // Top controls
    h("div",{style:{padding:"8px 14px",borderBottom:"1px solid rgba(200,170,120,0.1)",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}},
      h("span",{style:{fontSize:9,color:"#7a7060",fontWeight:700}},"DRAFT POS"),
      h("input",{type:"number",min:1,max:14,value:draftPos,onChange:ev=>setDraftPos(Math.min(14,Math.max(1,parseInt(ev.target.value)||1))),
        style:{width:36,padding:"3px",background:"rgba(200,170,120,0.1)",border:"1px solid rgba(200,170,120,0.2)",borderRadius:3,color:"#f0e8d8",fontSize:12,fontWeight:700,textAlign:"center"}}),
      h("div",{style:{width:1,height:20,background:"rgba(200,170,120,0.15)"}}),
      h("div",{style:{display:"flex",gap:0}},
        ...[["pos","By Position"],["round","By Round"]].map(([k,l])=>h("button",{key:k,onClick:()=>setView(k),style:{padding:"5px 12px",fontSize:11,fontWeight:700,cursor:"pointer",border:"none",borderBottom:view===k?"2px solid #c8a878":"2px solid transparent",background:view===k?"rgba(200,170,120,0.08)":"transparent",color:view===k?"#f0e8d8":"#9a8e7a"}},l))),
      h("div",{style:{marginLeft:"auto",display:"flex",alignItems:"center",gap:10}},
        h("div",{style:{textAlign:"right"}},
          h("div",{style:{fontSize:9,color:"#7a7060"}},"FILLED"),
          h("div",{style:{fontSize:14,fontWeight:800,color:filledCount>=19?"#60e060":"#d4c8b0"}},filledCount+"/19")),
        h("div",{style:{textAlign:"right"}},
          h("div",{style:{fontSize:9,color:"#7a7060"}},"PROJECTED"),
          h("div",{style:{fontSize:14,fontWeight:800,color:GOLD}},Math.round(totalPts).toLocaleString())),
        h("button",{onClick:clearAll,style:{padding:"4px 8px",borderRadius:3,fontSize:9,fontWeight:700,cursor:"pointer",background:"rgba(200,80,80,0.1)",border:"1px solid rgba(200,80,80,0.2)",color:"#d07050"}},"\u21BB Clear"))),

    // Main content: two panels
    h("div",{style:{flex:1,display:"flex",overflow:"hidden"}},
      // LEFT: Roster Plan
      h("div",{style:{width:view==="round"?420:360,flexShrink:0,overflow:"auto",borderRight:"1px solid rgba(200,170,120,0.1)",background:"rgba(200,170,120,0.02)"}},
        view==="pos"?
          // === BY POSITION VIEW ===
          h("div",{style:{padding:"8px"}},
            ...["Offense","Pitching","Bench"].map(section=>{
              const slots=section==="Offense"?rosterSlots.filter(s=>["C","1B","2B","3B","SS","OF","Util"].includes(s.l)):
                section==="Pitching"?rosterSlots.filter(s=>["SP","RP","P"].includes(s.l)):
                rosterSlots.filter(s=>s.l==="BN");
              return h("div",{key:section,style:{marginBottom:12}},
                h("div",{style:{fontSize:10,color:"#7a7060",fontWeight:700,padding:"4px 0",borderBottom:"1px solid rgba(200,170,120,0.08)",marginBottom:4}},section.toUpperCase()),
                ...slots.map(slot=>{
                  const pl=plan[slot.id];
                  const isSel=selSlot===slot.id;
                  return h("div",{key:slot.id,
                    onClick:()=>!pl&&setSelSlot(isSel?null:slot.id),
                    style:{padding:"6px 8px",display:"flex",alignItems:"center",gap:8,borderRadius:4,marginBottom:2,cursor:pl?"default":"pointer",
                      background:isSel?"rgba(200,170,120,0.12)":pl?"rgba(200,170,120,0.04)":"rgba(200,170,120,0.01)",
                      border:isSel?"1px solid #c8a878":"1px solid transparent"}},
                    h("span",{style:{width:30,fontSize:10,color:"#c8a878",fontWeight:700,flexShrink:0}},slot.l),
                    pl?h("div",{style:{flex:1,display:"flex",alignItems:"center",gap:6}},
                      h("div",{style:{width:3,height:18,borderRadius:1,background:gtc(pl.t),flexShrink:0}}),
                      h("div",{style:{flex:1,minWidth:0}},
                        h("div",{style:{fontWeight:600,color:"#f0e8d8",fontSize:12,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},pl.n),
                        h("div",{style:{fontSize:9,color:"#9a8e7a",display:"flex",gap:4}},
                          h("span",null,pl.pos),
                          h("span",{style:{color:GOLD}},Math.round(pl.pts)+" pts"),
                          pl.targetRd?h("span",{style:{color:"#7ab8e8"}},"Rd "+pl.targetRd):null)),
                      h("button",{onClick:ev=>{ev.stopPropagation();unassign(slot.id)},style:{padding:"2px 6px",borderRadius:2,fontSize:9,cursor:"pointer",background:"rgba(200,80,80,0.1)",border:"1px solid rgba(200,80,80,0.2)",color:"#d07050"}},"\u2715")
                    ):h("span",{style:{color:isSel?"#c8a878":"#3a3830",fontSize:11,fontStyle:"italic"}},isSel?"Select from player pool \u2192":"Click to fill")
                  );
                })
              );
            })
          ):
          // === BY ROUND VIEW ===
          h("div",{style:{padding:"8px"}},
            ...sp.map((pick,i)=>{
              const rd=i+1;
              const entry=byRound.find(([k,v])=>v.targetRd===rd);
              const pl=entry?entry[1]:null;
              const slotId=entry?entry[0]:null;
              const slotLabel=slotId?rosterSlots.find(s=>s.id===slotId)?.l:"";
              return h("div",{key:rd,style:{padding:"6px 8px",display:"flex",alignItems:"center",gap:8,borderRadius:4,marginBottom:2,
                background:pl?"rgba(200,170,120,0.04)":"transparent",
                borderLeft:pl?"3px solid "+GOLD:"3px solid rgba(200,170,120,0.06)"}},
                h("div",{style:{width:50,flexShrink:0}},
                  h("div",{style:{fontSize:12,fontWeight:800,color:"#d4c8b0"}},"Rd "+rd),
                  h("div",{style:{fontSize:9,color:"#7a7060"}},"Pick #"+pick)),
                pl?h("div",{style:{flex:1,display:"flex",alignItems:"center",gap:6}},
                  h("div",{style:{width:3,height:18,borderRadius:1,background:gtc(pl.t),flexShrink:0}}),
                  h("div",{style:{flex:1,minWidth:0}},
                    h("div",{style:{fontWeight:600,color:"#f0e8d8",fontSize:12}},pl.n),
                    h("div",{style:{fontSize:9,color:"#9a8e7a",display:"flex",gap:4}},
                      h("span",{style:{color:"#c8a878"}},slotLabel),
                      h("span",null,pl.pos),
                      h("span",{style:{color:GOLD}},Math.round(pl.pts)),
                      pl.adp<900?h("span",{style:{color:"#7a7060"}},"ADP "+pl.adp):null)),
                  h("button",{onClick:()=>unassign(slotId),style:{padding:"2px 6px",borderRadius:2,fontSize:9,cursor:"pointer",background:"rgba(200,80,80,0.1)",border:"1px solid rgba(200,80,80,0.2)",color:"#d07050"}},"\u2715")
                ):h("span",{style:{color:"#3a3830",fontSize:10,fontStyle:"italic"}},"Unplanned")
              );
            })
          )
      ),

      // RIGHT: Player Pool
      h("div",{style:{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}},
        // Pool header
        h("div",{style:{padding:"6px 10px",borderBottom:"1px solid rgba(200,170,120,0.08)",display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}},
          selSlot?h("div",{style:{display:"flex",alignItems:"center",gap:6}},
            h("span",{style:{fontSize:11,color:GOLD,fontWeight:700}},"Filling: "+rosterSlots.find(s=>s.id===selSlot)?.l),
            h("span",{style:{fontSize:9,color:"#7a7060"}},"Pick a round then a player"),
            h("button",{onClick:()=>{setSelSlot(null);setSearch("")},style:{padding:"2px 8px",borderRadius:3,fontSize:9,cursor:"pointer",background:"rgba(200,170,120,0.1)",border:"1px solid rgba(200,170,120,0.15)",color:"#9a8e7a"}},"\u2715 Cancel")):
          h("span",{style:{fontSize:11,color:"#9a8e7a",fontWeight:600}},"PLAYER POOL"),

            h("input",{type:"text",placeholder:"Search...",value:search,onChange:ev=>setSearch(ev.target.value),style:{width:130,padding:"4px 7px",background:"rgba(200,170,120,0.06)",border:"1px solid rgba(200,170,120,0.15)",borderRadius:3,color:"#e0d4b8",fontSize:10,marginLeft:6}}),
            ...posOpts.map(f=>h("button",{key:f,onClick:()=>setPosF(f),style:{padding:"3px 6px",borderRadius:3,fontSize:8,fontWeight:700,cursor:"pointer",border:posF===f?"1px solid #c8a878":"1px solid rgba(200,170,120,0.1)",background:posF===f?"rgba(200,170,120,0.2)":"transparent",color:posF===f?"#f0e8d8":"#9a8e7a"}},f))):null,
          h("span",{style:{fontSize:9,color:"#7a7060",marginLeft:"auto"}},filteredPool.length)),

              h("th",{style:{textAlign:"left",padding:"6px 8px",fontSize:9,fontWeight:700,color:"#9a8e7a",position:"sticky",top:0,background:"#1e1a14"}},"PLAYER"),

              h("th",{style:{...S,fontWeight:700,position:"sticky",top:0,background:"#1e1a14",cursor:"pointer",userSelect:"none",color:poolSort==="par"?"#f0e8d8":"#9a8e7a",borderBottom:poolSort==="par"?"2px solid #c8a878":"none"},onClick:()=>doPoolSort("par")},"PAR"+(poolSort==="par"?(poolAsc?" \u25B2":" \u25BC"):"")),
              h("th",{style:{...S,fontWeight:700,position:"sticky",top:0,background:"#1e1a14",cursor:"pointer",userSelect:"none",color:poolSort==="adp"?"#f0e8d8":"#9a8e7a",borderBottom:poolSort==="adp"?"2px solid #c8a878":"none"},onClick:()=>doPoolSort("adp")},"ADP"+(poolSort==="adp"?(poolAsc?" \u25B2":" \u25BC"):"")),
              selSlot?h("th",{style:{width:100,position:"sticky",top:0,background:"#1e1a14",textAlign:"center",fontSize:9,color:GOLD,fontWeight:700}},"ROUND"):null)),
            h("tbody",null,...filteredPool.slice(0,550).map((p,i)=>{
              const isP=p.type==="P",wt=watch.has(wk(p));
              return h("tr",{key:p.n+p.t,style:{background:wt?"rgba(240,200,80,0.04)":i%2?"rgba(200,170,120,0.02)":"transparent",borderLeft:wt?"2px solid "+GOLD:"2px solid transparent"},
                onMouseEnter:ev=>{ev.currentTarget.style.background="rgba(200,170,120,0.07)"},
                onMouseLeave:ev=>{ev.currentTarget.style.background=wt?"rgba(240,200,80,0.04)":i%2?"rgba(200,170,120,0.02)":"transparent"}},
                h("td",{style:{padding:"4px 8px"}},h("div",{style:{display:"flex",alignItems:"center",gap:5}},
                  h("div",{style:{width:2,height:16,borderRadius:1,background:gtc(p.t),flexShrink:0}}),
                  h("div",null,
                    h("div",{style:{display:"flex",alignItems:"center",gap:3}},
                      h("span",{style:{fontWeight:600,color:"#f0e8d8",fontSize:11}},p.n),
                      h("span",{onClick:ev=>{ev.stopPropagation();tw(wk(p))},style:{cursor:"pointer",fontSize:10,color:wt?GOLD:"#504840"}},wt?"\u2605":"\u2606")),
                    h("div",{style:{fontSize:8,color:"#9a8e7a",display:"flex",gap:2}},
                      h("span",{style:{fontWeight:700}},p.t),
                      h("span",{style:{background:isP?((p.pt||"")==="SP"?"rgba(80,140,200,0.18)":"rgba(220,160,80,0.18)"):"rgba(100,180,100,0.12)",color:isP?((p.pt||"")==="SP"?"#7ab8e8":"#e0b870"):"#90c890",padding:"0 3px",borderRadius:2,fontWeight:700,fontSize:7}},p.pos))))),
                h("td",{style:{...S,fontWeight:700,color:p.parRk<=10?"#40ff60":p.parRk<=30?"#60c860":p.parRk<=60?"#90b890":"#b0a898"}},p.parRk),
                h("td",{style:{...S,fontWeight:700,color:GOLD}},Math.round(p.pts)),
                h("td",{style:{...S,color:p.par>200?"#60c860":"#b0a898"}},Math.round(p.par)),
                h("td",{style:{...S,color:p.adp>=900?"#504840":"#b0a898"}},p.adp>=900?999:p.adp),
                selSlot?h("td",{style:{padding:"4px",textAlign:"center"}},
                  h("select",{onChange:ev=>{const rd=parseInt(ev.target.value);if(rd)assign(selSlot,p,rd);},defaultValue:"",
                    style:{padding:"3px 4px",borderRadius:3,fontSize:10,fontWeight:700,cursor:"pointer",background:"rgba(200,170,120,0.1)",border:"1px solid rgba(200,170,120,0.2)",color:"#f0e8d8",appearance:"auto"}},
                    h("option",{value:"",disabled:true},"Rd?"),
                    ...sp.map((pk,idx)=>h("option",{key:idx+1,value:idx+1},"Rd "+(idx+1)+" (#"+pk+")"))
                  )):null
              );
            }))))
      )
    )
  );
}

ReactDOM.render(h(App),document.getElementById("root"));

</script>
