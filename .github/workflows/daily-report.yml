name: Daily Fantasy Report

on:
  schedule:
    # 8am ET = 12pm UTC (will be 1pm UTC during DST, close enough)
    - cron: '0 12 * * *'
  workflow_dispatch:  # allows manual trigger from GitHub UI

permissions:
  contents: write  # needed to commit report back to repo

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Yahoo OAuth credentials
        env:
          YAHOO_OAUTH_JSON: ${{ secrets.YAHOO_OAUTH_JSON }}
        run: |
          python -c "import os, pathlib; pathlib.Path('oauth2.json').write_text(os.environ['YAHOO_OAUTH_JSON'])"
          # Print non-sensitive diagnostics so we can verify the secret round-tripped intact
          python -c "
          import json
          d = json.load(open('oauth2.json'))
          ck = d.get('consumer_key', '')
          print(f'oauth2.json keys: {sorted(d.keys())}')
          print(f'consumer_key len={len(ck)}, prefix={ck[:6]!r}, suffix={ck[-6:]!r}')
          print(f'has refresh_token: {bool(d.get(\"refresh_token\"))}')
          print(f'token_time: {d.get(\"token_time\")}')
          "

      - name: Run daily report
        run: python daily_report.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reports/ data/snapshots/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily report $(date +%Y-%m-%d)"
            git push
          fi
